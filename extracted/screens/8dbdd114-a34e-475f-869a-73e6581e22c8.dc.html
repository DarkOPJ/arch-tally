e=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px\">\n          <sc-for list=\"{{prompts}}\" as=\"p\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{p.use}}\" style=\"display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer\">\n              <span style=\"font-size: 12px; color: var(--muted)\">{{p.kind}}<\u002Fspan>\n              <span>{{p.text}}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n          <div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted)\">Recently ingested<\u002Fdiv>\n          <a href=\"Library.dc.html\" style=\"font-size: 12px; color: var(--muted)\">View library<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n          <a href=\"Viewer.dc.html\" style=\"display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; font-size: 13px\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--muted)\">PDF<\u002Fspan>rep_notes_sept.pdf<\u002Fa>\n          <a href=\"Viewer.dc.html\" style=\"display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; font-size: 13px\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--muted)\">CSV<\u002Fspan>renewals_q3.csv<\u002Fa>\n          <a href=\"Viewer.dc.html\" style=\"display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; font-size: 13px\"><span style=\"font-family: 'Geist Mono', monospace; font-size: 10px; color: var(--muted)\">XLSX<\u002Fspan>win_rate_by_rep.xlsx<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:960}}\">\nclass Component extends DCLogic {\n  initTheme(p) {\n    if (p && p.theme) return p.theme;\n    try { const v = window.localStorage.getItem('tally-theme'); if (v === 'dark' || v === 'light') return v; } catch (e) {}\n    return 'light';\n  }\n  componentDidUpdate(prev) {\n    if (this.props.theme && prev.theme !== this.props.theme) this.setState({ theme: this.props.theme });\n  }\n  themeVals() {\n    const d = this.state.theme === 'dark';\n    return {\n      themeClass: d ? 't-dark' : 't-light',\n      isDark: d,\n      isLight: !d,\n      themeLabel: d ? 'Switch to light theme' : 'Switch to dark theme',\n      toggleTheme: () => {\n        const t = this.state.theme === 'dark' ? 'light' : 'dark';\n        try { window.localStorage.setItem('tally-theme', t); } catch (e) {}\n        this.setState({ theme: t });\n      }\n    };\n  }\n  constructor(props) {\n    super(props);\n    this.state = { theme: this.initTheme(props), scope: 'all', draft: '' };\n  }\n  renderVals() {\n    const s = this.state;\n    const prompts = [\n      { kind: 'Performance', text: 'Who is furthest behind quota this quarter, and why?' },\n      { kind: 'Pipeline', text: 'Which open deals over $50K have no activity in 30 days?' },\n      { kind: 'Forecast', text: 'How does commit compare to best case for Q4?' },\n      { kind: 'Accounts', text: 'Which renewals are at risk next quarter?' }\n    ].map((p) => ({ ...p, use: () => this.setState({ draft: p.text }) }));\n    return {\n      ...this.themeVals(),\n      prompts,\n      draft: s.draft,\n      onDraft: (e) => this.setState({ draft: e.target.value }),\n      allOn: s.scope === 'all' ? 'true' : 'false',\n      pickOn: s.scope === 'files' ? 'true' : 'false',\n      allBorder: s.scope === 'all' ? 'var(--accent)' : 'var(--line)',\n      pickBorder: s.scope === 'files' ? 'var(--accent)' : 'var(--line)',\n      showPick: s.scope === 'files',\n      pickAll: () => this.setState({ scope: 'all' }),\n      pickFiles: () => this.setState({ scope: 'files' })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
