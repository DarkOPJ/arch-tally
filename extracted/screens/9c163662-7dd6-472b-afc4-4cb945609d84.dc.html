div style=\"font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0 8px 8px\">Connected sources<\u002Fdiv>\n      <sc-for list=\"{{conns}}\" as=\"c\" hint-placeholder-count=\"4\">\n        <button type=\"button\" sc-camel-on-click=\"{{c.pick}}\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; padding: 8px 10px; border: 1px solid {{c.border}}; border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left\">\n          <span>{{c.name}}<\u002Fspan>\n          <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--muted)\">{{c.count}}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n      <a href=\"Sources.dc.html\" style=\"padding: 8px 10px; font-size: 13px; color: var(--muted)\">+ Connect a source<\u002Fa>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n    <header style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 32px; border-bottom: 1px solid var(--line)\">\n      <nav aria-label=\"Breadcrumb\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted)\">\n        <a href=\"#\" style=\"color: var(--muted); text-decoration: none\">{{connName}}<\u002Fa><span aria-hidden=\"true\">/<\u002Fspan>\n        <a href=\"#\" style=\"color: var(--muted); text-decoration: none\">Sales<\u002Fa><span aria-hidden=\"true\">/<\u002Fspan>\n        <a href=\"#\" style=\"color: var(--muted); text-decoration: none\">2026<\u002Fa><span aria-hidden=\"true\">/<\u002Fspan>\n        <span style=\"color: var(--text); font-weight: 500\">Q3 Reviews<\u002Fspan>\n      <\u002Fnav>\n      <div style=\"display: flex; gap: 8px\">\n        <button type=\"button\" style=\"height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 13px\">Upload files<\u002Fbutton>\n        <button type=\"button\" style=\"height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 13px\">Sync folder<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <sc-if value=\"{{isSelect}}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"flex: 1; padding: 32px; display: flex; flex-direction: column; gap: 24px\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px\">\n          <h1 style=\"margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em\">Pick files to ask about<\u002Fh1>\n          <p style=\"margin: 0; color: var(--muted); max-width: 620px\">Select any files in this folder. Tally reads and indexes them on the spot, so you can start asking while it works. Files already in your library are reused.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\">\n          <label style=\"display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); flex: 1 1 260px; max-width: 360px\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.5-3.5\"><\u002Fpath><\u002Fsvg>\n            <input type=\"search\" placeholder=\"Filter files in Q3 Reviews\" aria-label=\"Filter files\" style=\"border: none; outline: none; background: transparent; width: 100%; font-size: 13px\">\n          <\u002Flabel>\n          <button type=\"button\" style=\"height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; color: var(--muted); cursor: pointer\">Type: All<\u002Fbutton>\n          <button type=\"button\" style=\"height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; color: var(--muted); cursor: pointer\">Modified: Any time<\u002Fbutton>\n          <span style=\"flex: 1\"><\u002Fspan>\n          <button type=\"button\" sc-camel-on-click=\"{{selectAll}}\" style=\"height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; cursor: pointer\">{{allLabel}}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"border: 1px solid var(--line); border-radius: 10px; overflow-x: auto\">\n          <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 13px; min-width: 720px\">\n            <sc-raw-thead>\n              <sc-raw-tr style=\"text-align: left; color: var(--muted)\">\n                <sc-raw-th style=\"width: 44px; padding: 10px 0 10px 16px; border-bottom: 1px solid var(--line)\"><span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Select<\u002Fspan><\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 10px 12px; font-weight: 500; border-bottom: 1px solid var(--line)\">Name<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 10px 12px; font-weight: 500; border-bottom: 1px solid var(--line)\">Type<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 10px 12px; font-weight: 500; border-bottom: 1px solid var(--line); text-align: right\">Size<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 10px 12px; font-weight: 500; border-bottom: 1px solid var(--line)\">Modified<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 10px 12px; font-weight: 500; border-bottom: 1px solid var(--line)\">Owner<\u002Fsc-raw-th>\n                <sc-raw-th style=\"padding: 10px 16px 10px 12px; font-weight: 500; border-bottom: 1px solid var(--line)\">In library<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{files}}\" as=\"f\" hint-placeholder-count=\"9\">\n                <sc-raw-tr style=\"background: {{f.bg}}\">\n                  <sc-raw-td style=\"padding: 12px 0 12px 16px; border-bottom: 1px solid var(--line)\"><input type=\"checkbox\" checked=\"{{f.checked}}\" sc-camel-on-change=\"{{f.toggle}}\" aria-label=\"Select {{f.name}}\"><\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 12px; border-bottom: 1px solid var(--line); font-weight: 500\">{{f.name}}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 12px; border-bottom: 1px solid var(--line)\"><span style=\"display: inline-flex; height: 22px; align-items: center; padding: 0 8px; border: 1px solid var(--line); border-radius: 5px; font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--muted)\">{{f.type}}<\u002Fspan><\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 12px; border-bottom: 1px solid var(--line); text-align: right; font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--muted)\">{{f.size}}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 12px; border-bottom: 1px solid var(--line); color: var(--muted)\">{{f.modified}}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 12px; border-bottom: 1px solid var(--line); color: var(--muted)\">{{f.owner}}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding: 12px 16px 12px 12px; border-bottom: 1px solid var(--line); color: var(--muted)\">{{f.status}}<\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position: sticky; bottom: 0; border-top: 1px solid var(--line); background: var(--surface); padding: 16px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px\">\n        <div style=\"display: flex; flex-direction: column; line-height: 1.35\">\n          <span style=\"font-weight: 600\">{{selCount}} selected<\u002Fspan>\n          <span style=\"font-size: 12px; color: var(--muted)\">{{selDetail}}<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"flex: 1\"><\u002Fspan>\n        <button type=\"button\" sc-camel-on-click=\"{{clear}}\" style=\"height: 40px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); cursor: pointer\">Clear<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{start}}\" style=\"height: 40px; padding: 0 18px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-fill); color: var(--on-accent); font-weight: 500; cursor: pointer\">Ingest &amp; start asking<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{isIngest}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex: 1; padding: 32px; display: flex; flex-direction: column; gap: 28px; max-width: 880px; width: 100%; box-sizing: border-box; margin: 0 auto\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px\">\n          <h1 style=\"margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em\">{{ingestTitle}}<\u002Fh1>\n          <p style=\"margin: 0; color: var(--muted)\">Ask now — answers use each file as soon as it reaches Ready, and say which files were still processing.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border: 1px solid var(--line); border-radius: 10px\">\n          <sc-for list=\"{{chosen}}\" as=\"f\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 14px 16px; border-bottom: 1px solid var(--line)\">\n              <span style=\"display: inline-flex; height: 22px; align-items: center; padding: 0 8px; border: 1px solid var(--line); border-radius: 5px; font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--muted)\">{{f.type}}<\u002Fspan>\n              <span style=\"font-weight: 500; flex: 1 1 200px; min-width: 0\">{{f.name}}<\u002Fspan>\n              <span style=\"flex: 1 1 180px; height: 6px; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden\"><span style=\"display: block; height: 100%; width: {{f.pct}}%; background: var(--accent-fill)\"><\u002Fspan><\u002Fspan>\n              <span style=\"width: 120px; font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--muted); text-align: right\">{{f.stage}}<\u002Fspan>\n              <a href=\"Viewer.dc.html\" style=\"font-size: 12px; color: var(--muted)\">View<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px\">\n          <div style=\"padding: 14px 16px; border-right: 1px solid var(--line)\"><div style=\"font-size: 12px; color: var(--muted)\">1 · Read<\u002Fdiv><div style=\"font-size: 13px\">Text, tables, slides<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding: 14px 16px; border-right: 1px solid var(--line)\"><div style=\"font-size: 12px; color: var(--muted)\">2 · Chunk<\u002Fdiv><div style=\"font-size: 13px\">Rows &amp; sections<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding: 14px 16px; border-right: 1px solid var(--line)\"><div style=\"font-size: 12px; color: var(--muted)\">3 · Embed<\u002Fdiv><div style=\"font-size: 13px\">Vector + keyword<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding: 14px 16px\"><div style=\"font-size: 12px; color: var(--muted)\">4 · Ready<\u002Fdiv><div style=\"font-size: 13px\">Searchable in chat<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border: 2px solid transparent; border-radius: 14px; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--ring) border-box\">\n          <label for=\"ask2\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Ask about the selected files<\u002Flabel>\n          <textarea id=\"ask2\" rows=\"2\" placeholder=\"Ask about these files — e.g. “Summarise East vs West pipeline for Q3”\" style=\"display: block; width: 100%; box-sizing: border-box; border: none; outline: none; resize: none; padding: 16px 16px 4px; background: transparent; font-size: 14px\"><\u002Ftextarea>\n          <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px 10px 12px\">\n            <span style=\"display: inline-flex; align-items: center; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted)\">Scope: {{selCount}} selected files<\u002Fspan>\n            <span style=\"flex: 1\"><\u002Fspan>\n            <a href=\"Main.dc.html\" aria-label=\"Send\" style=\"width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--accent); border-radius: 9px; background: var(--accent-fill); color: var(--on-accent)\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 19V5M5 12l7-7 7 7\"><\u002Fpath><\u002Fsvg>\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n          <a href=\"Main.dc.html\" style=\"display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 999px; text-decoration: none; font-size: 13px\">Summarise these files<\u002Fa>\n          <a href=\"Main.dc.html\" style=\"display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 999px; text-decoration: none; font-size: 13px\">Which deals are at risk?<\u002Fa>\n          <a href=\"Main.dc.html\" style=\"display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 999px; text-decoration: none; font-size: 13px\">Compare reps by attainment<\u002Fa>\n          <button type=\"button\" sc-camel-on-click=\"{{back}}\" style=\"min-height: 36px; padding: 0 14px; border: 1px solid transparent; background: transparent; font-size: 13px; color: var(--muted); cursor: pointer; text-decoration: underline\">Change selection<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:960}}\">\nclass Component extends DCLogic {\n  initTheme(p) {\n    if (p && p.theme) return p.theme;\n    try { const v = window.localStorage.getItem('tally-theme'); if (v === 'dark' || v === 'light') return v; } catch (e) {}\n    return 'light';\n  }\n  componentDidUpdate(prev) {\n    if (this.props.theme && prev.theme !== this.props.theme) this.setState({ theme: this.props.theme });\n  }\n  themeVals() {\n    const d = this.state.theme === 'dark';\n    return {\n      themeClass: d ? 't-dark' : 't-light',\n      isDark: d,\n      isLight: !d,\n      themeLabel: d ? 'Switch to light theme' : 'Switch to dark theme',\n      toggleTheme: () => {\n        const t = this.state.theme === 'dark' ? 'light' : 'dark';\n        try { window.localStorage.setItem('tally-theme', t); } catch (e) {}\n        this.setState({ theme: t });\n      }\n    };\n  }\n  constructor(props) {\n    super(props);\n    this.state = { theme: this.initTheme(props), conn: 0, sel: { 1: true, 2: true, 4: true }, phase: 'select', tick: 0 };\n  }\n  componentWillUnmount() { if (this.timer) clearInterval(this.timer); }\n  renderVals() {\n    const s = this.state;\n    const connList = [\n      { name: 'Shared drive', count: '1,284' },\n      { name: 'CRM — Opportunities', count: '18.4k' },\n      { name: 'Email attachments', count: '362' },\n      { name: 'Uploads', count: '41' }\n    ];\n    const conns = connList.map((c, i) => ({ ...c, border: i === s.conn ? 'var(--accent)' : 'transparent', pick: () => this.setState({ conn: i }) }));\n    const raw = [\n      { id: 1, name: 'Q3_pipeline_east.csv', type: 'CSV', size: '1.6 MB', kb: 1600, modified: 'Oct 2, 2026', owner: 'Rev Ops', status: 'Not yet' },\n      { id: 2, name: 'forecast_call_oct14.docx', type: 'DOCX', size: '220 KB', kb: 220, modified: 'Oct 14, 2026', owner: 'Ama Mensah', status: 'Not yet' },\n      { id: 3, name: 'Q3_pipeline_west.csv', type: 'CSV', size: '1.8 MB', kb: 1800, modified: 'Oct 2, 2026', owner: 'Rev Ops', status: 'Indexed' },\n      { id: 4, name: 'QBR_deck_west.pptx', type: 'PPTX', size: '5.4 MB', kb: 5400, modified: 'Oct 9, 2026', owner: 'Ama Mensah', status: 'Not yet' },\n      { id: 5, name: 'territory_plan_2026.pdf', type: 'PDF', size: '2.1 MB', kb: 2100, modified: 'Jan 18, 2026', owner: 'Sales Ops', status: 'Not yet' },\n      { id: 6, name: 'win_rate_by_rep.xlsx', type: 'XLSX', size: '340 KB', kb: 340, modified: 'Oct 3, 2026', owner: 'Rev Ops', status: 'Indexed' },\n      { id: 7, name: 'comp_plan_Q3.pdf', type: 'PDF', size: '860 KB', kb: 860, modified: 'Jul 1, 2026', owner: 'Finance', status: 'Not yet' },\n      { id: 8, name: 'renewals_q3.csv', type: 'CSV', size: '410 KB', kb: 410, modified: 'Oct 5, 2026', owner: 'CS Ops', status: 'Indexed' },\n      { id: 9, name: 'rep_notes_sept.pdf', type: 'PDF', size: '1.2 MB', kb: 1200, modified: 'Sep 30, 2026', owner: 'Ama Mensah', status: 'Indexed' }\n    ];\n    const files = raw.map((f) => ({\n      ...f,\n      checked: !!s.sel[f.id],\n      bg: s.sel[f.id] ? 'var(--accent-soft)' : 'var(--surface)',\n      toggle: () => { const sel = { ...this.state.sel }; if (sel[f.id]) delete sel[f.id]; else sel[f.id] = true; this.setState({ sel }); }\n    }));\n    const picked = raw.filter((f) => s.sel[f.id]);\n    const kb = picked.reduce((a, f) => a + f.kb, 0);\n    const newCount = picked.filter((f) => f.status !== 'Indexed').length;\n    const allOn = picked.length === raw.length;\n    const stages = ['Queued', 'Reading', 'Chunking', 'Embedding', 'Ready'];\n    const chosen = picked.map((f, i) => {\n      if (f.status === 'Indexed') return { ...f, pct: 100, stage: 'Ready · cached' };\n      const p = Math.max(0, Math.min(100, s.tick * 9 - i * 22));\n      const st = p >= 100 ? 'Ready' : stages[Math.min(3, Math.floor(p / 25) + (p > 0 ? 1 : 0))];\n      return { ...f, pct: p, stage: st };\n    });\n    const ready = chosen.filter((f) => f.pct >= 100).length;\n    return {\n      ...this.themeVals(),\n      conns,\n      connName: connList[s.conn].name,\n      files,\n      selCount: picked.length,\n      selDetail: (kb >= 1000 ? (kb / 1000).toFixed(1) + ' MB' : kb + ' KB') + ' · ' + newCount + ' new to index · ' + (picked.length - newCount) + ' already in library',\n      allLabel: allOn ? 'Clear all' : 'Select all',\n      selectAll: () => { const sel = {}; if (!allOn) raw.forEach((f) => { sel[f.id] = true; }); this.setState({ sel }); },\n      clear: () => this.setState({ sel: {} }),\n      isSelect: s.phase === 'select',\n      isIngest: s.phase === 'ingest',\n      chosen,\n      ingestTitle: ready === chosen.length ? 'All ' + chosen.length + ' files ready' : 'Indexing ' + chosen.length + ' files · ' + ready + ' ready',\n      start: () => {\n        if (!picked.length) return;\n        this.setState({ phase: 'ingest', tick: 0 });\n        if (this.timer) clearInterval(this.timer);\n        this.timer = setInterval(() => {\n          if (this.state.tick > 20) { clearInterval(this.timer); return; }\n          this.setState({ tick: this.state.tick + 1 });\n        }, 350);\n      },\n      back: () => { if (this.timer) clearInterval(this.timer); this.setState({ phase: 'select', tick: 0 }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
