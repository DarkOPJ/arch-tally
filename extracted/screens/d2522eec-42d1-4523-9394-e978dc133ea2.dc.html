 if (this.props.theme && prev.theme !== this.props.theme) this.setState({ theme: this.props.theme });\n  }\n  themeVals() {\n    const d = this.state.theme === 'dark';\n    return {\n      themeClass: d ? 't-dark' : 't-light',\n      isDark: d,\n      isLight: !d,\n      themeLabel: d ? 'Switch to light theme' : 'Switch to dark theme',\n      toggleTheme: () => {\n        const t = this.state.theme === 'dark' ? 'light' : 'dark';\n        try { window.localStorage.setItem('tally-theme', t); } catch (e) {}\n        this.setState({ theme: t });\n      }\n    };\n  }\n  renderVals() { return this.themeVals(); }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
