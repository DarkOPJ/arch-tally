Fsvg>\n            <\u002Fbutton>\n            <button type=\"button\" style=\"display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 12px; color: var(--muted); cursor: pointer\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" aria-hidden=\"true\" style=\"color: var(--accent)\"><ellipse cx=\"12\" cy=\"5\" rx=\"8\" ry=\"3\"><\u002Fellipse><path d=\"M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3\"><\u002Fpath><\u002Fsvg>\n              4 sources · Q3 2026 · West\n            <\u002Fbutton>\n            <span style=\"flex: 1\"><\u002Fspan>\n            <button type=\"button\" sc-camel-on-click=\"{{send}}\" aria-label=\"Send\" style=\"width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 9px; background: var(--accent-fill); color: var(--on-accent); cursor: pointer\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 19V5M5 12l7-7 7 7\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"max-width: 760px; margin: 10px auto 0; text-align: center; font-size: 12px; color: var(--note)\">Answers are drawn from your indexed data and cite their sources. Check figures before sharing.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <sc-if value=\"{{showSources}}\" hint-placeholder-val=\"{{ true }}\">\n    <aside aria-label=\"Sources\" style=\"flex: 1 1 320px; max-width: 100%; box-sizing: border-box; border-left: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n        <h2 style=\"margin: 0; font-size: 14px; font-weight: 600\">Sources<\u002Fh2>\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--muted)\">4 retrieved<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{sources}}\" as=\"s\" hint-placeholder-count=\"4\">\n        <button type=\"button\" sc-camel-on-click=\"{{s.pick}}\" style=\"display: flex; flex-direction: column; gap: 8px; width: 100%; text-align: left; padding: 14px; border: 1px solid {{s.border}}; border-radius: 10px; background: {{s.bg}}; cursor: pointer\">\n          <span style=\"display: flex; align-items: center; gap: 8px; width: 100%\">\n            <span style=\"display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; border: 1px solid var(--accent); border-radius: 5px; color: var(--accent); font-family: 'Geist Mono', monospace; font-size: 11px\">{{s.n}}<\u002Fspan>\n            <span style=\"font-weight: 500; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{s.file}}<\u002Fspan>\n            <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--muted)\">{{s.score}}<\u002Fspan>\n          <\u002Fspan>\n          <span style=\"font-size: 12px; color: var(--muted)\">{{s.loc}}<\u002Fspan>\n          <span style=\"font-family: 'Geist Mono', monospace; font-size: 12px; line-height: 1.6; padding: 10px; border: 1px dashed var(--line-strong); border-radius: 6px\">{{s.snippet}}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n      <a href=\"Viewer.dc.html\" style=\"display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; border: 1px solid var(--accent); border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 500\">Open selected in document viewer<\u002Fa>\n      <div style=\"margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted)\">\n        <div style=\"display: flex; justify-content: space-between\"><span>Retrieval<\u002Fspan><span style=\"font-family: 'Geist Mono', monospace\">hybrid · top-k 12<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; justify-content: space-between\"><span>Index updated<\u002Fspan><span style=\"font-family: 'Geist Mono', monospace\">2h ago<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:960}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { theme: this.initTheme(props), active: 1, draft: '', sent: [], showSources: true };\n  }\n  initTheme(p) {\n    if (p && p.theme) return p.theme;\n    try { const v = window.localStorage.getItem('tally-theme'); if (v === 'dark' || v === 'light') return v; } catch (e) {}\n    return 'light';\n  }\n  componentDidUpdate(prev) {\n    if (this.props.theme && prev.theme !== this.props.theme) this.setState({ theme: this.props.theme });\n  }\n  themeVals() {\n    const d = this.state.theme === 'dark';\n    return {\n      themeClass: d ? 't-dark' : 't-light',\n      isDark: d,\n      isLight: !d,\n      themeLabel: d ? 'Switch to light theme' : 'Switch to dark theme',\n      toggleTheme: () => {\n        const t = this.state.theme === 'dark' ? 'light' : 'dark';\n        try { window.localStorage.setItem('tally-theme', t); } catch (e) {}\n        this.setState({ theme: t });\n      }\n    };\n  }\n  renderVals() {\n    const s = this.state;\n    const raw = [\n      { n: 1, file: 'Q3_pipeline_west.csv', loc: 'Rows 212–219 · Opportunities', score: '0.91', snippet: 'Northwind Logistics · Negotiation · close date 2026-09-28 → 2026-10-17 · note: procurement review' },\n      { n: 2, file: 'win_rate_by_rep.xlsx', loc: 'Sheet “Q3” · B14:F14', score: '0.87', snippet: 'Boateng, K. · Enterprise win rate · Q2 31.0% · Q3 19.4%' },\n      { n: 3, file: 'renewals_q3.csv', loc: 'Rows 44–51 · Renewals', score: '0.84', snippet: 'Hartmann territory · 2 non-renewals (Aster Retail, Bluefin Co) · reason: pricing' },\n      { n: 4, file: 'rep_notes_sept.pdf', loc: 'Page 3 · Rep notes', score: '0.79', snippet: 'Ramos — Cobalt Health ($60K) closed lost to competitor after final pricing round.' }\n    ];\n    const pick = (n) => () => this.setState({ active: n, showSources: true });\n    const sources = raw.map((x) => ({\n      ...x,\n      border: x.n === s.active ? 'var(--accent)' : 'var(--line)',\n      bg: x.n === s.active ? 'var(--accent-soft)' : 'var(--surface)',\n      pick: pick(x.n)\n    }));\n    const followups = [\n      'Break down Kofi’s lost enterprise deals',\n      'Which slipped deals are likely to close in Q4?',\n      'Compare West attainment with other regions'\n    ].map((t) => ({ text: t, use: () => this.setState({ draft: t }) }));\n    const send = () => {\n      const q = (this.state.draft || '').trim();\n      if (!q) return;\n      this.setState({ sent: [...this.state.sent, { q }], draft: '' });\n    };\n    return {\n      ...this.themeVals(),\n      sources,\n      followups,\n      c1: pick(1), c2: pick(2), c3: pick(3), c4: pick(4),\n      draft: s.draft,\n      onDraft: (e) => this.setState({ draft: e.target.value }),\n      onKey: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } },\n      send,\n      sent: s.sent,\n      showSources: s.showSources,\n      toggleSources: () => this.setState({ showSources: !this.state.showSources }),\n      sourcesLabel: s.showSources ? 'Hide sources' : 'Show sources'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
