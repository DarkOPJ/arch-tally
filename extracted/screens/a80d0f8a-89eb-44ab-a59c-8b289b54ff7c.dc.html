x; min-width: 0; padding: 32px; display: flex; flex-direction: column; gap: 28px; box-sizing: border-box\">\n    <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px\">\n      <div style=\"display: flex; flex-direction: column; gap: 6px\">\n        <h1 style=\"margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em\">Settings<\u002Fh1>\n        <p style=\"margin: 0; color: var(--muted)\">How Tally reads your files, finds passages and answers.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 8px\">\n        <button type=\"button\" style=\"height: 40px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); cursor: pointer\">Discard<\u002Fbutton>\n        <button type=\"button\" style=\"height: 40px; padding: 0 16px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-fill); color: var(--on-accent); font-weight: 500; cursor: pointer\">Save changes<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start\">\n      <nav aria-label=\"Settings sections\" style=\"flex: 1 1 180px; max-width: 220px; display: flex; flex-direction: column; gap: 2px\">\n        <a href=\"#retrieval\" style=\"padding: 8px 12px; border: 1px solid var(--accent); border-radius: 8px; text-decoration: none; font-weight: 500\">Retrieval &amp; answers<\u002Fa>\n        <a href=\"#ingestion\" style=\"padding: 8px 12px; border: 1px solid transparent; border-radius: 8px; text-decoration: none; color: var(--muted)\">Ingestion<\u002Fa>\n        <a href=\"#team\" style=\"padding: 8px 12px; border: 1px solid transparent; border-radius: 8px; text-decoration: none; color: var(--muted)\">Team &amp; access<\u002Fa>\n        <a href=\"#retention\" style=\"padding: 8px 12px; border: 1px solid transparent; border-radius: 8px; text-decoration: none; color: var(--muted)\">Data retention<\u002Fa>\n      <\u002Fnav>\n\n      <div style=\"flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 24px; max-width: 820px\">\n        <section id=\"retrieval\" style=\"border: 1px solid var(--line); border-radius: 12px\">\n          <div style=\"padding: 18px 20px; border-bottom: 1px solid var(--line)\"><h2 style=\"margin: 0; font-size: 15px; font-weight: 600\">Retrieval &amp; answers<\u002Fh2><\u002Fdiv>\n          <fieldset style=\"margin: 0; border: none; border-bottom: 1px solid var(--line); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px\">\n            <legend style=\"float: left; padding: 0; font-weight: 500; margin-bottom: 4px\">Search mode<\u002Flegend>\n            <div style=\"clear: both; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px\">\n              <label style=\"display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--accent); border-radius: 10px; cursor: pointer\"><input type=\"radio\" name=\"mode\" checked=\"checked\" style=\"margin-top: 3px\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 500\">Hybrid<\u002Fspan><span style=\"font-size: 12px; color: var(--muted)\">Meaning + exact names and numbers<\u002Fspan><\u002Fspan><\u002Flabel>\n              <label style=\"display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer\"><input type=\"radio\" name=\"mode\" style=\"margin-top: 3px\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 500\">Semantic<\u002Fspan><span style=\"font-size: 12px; color: var(--muted)\">Best for notes and call summaries<\u002Fspan><\u002Fspan><\u002Flabel>\n              <label style=\"display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer\"><input type=\"radio\" name=\"mode\" style=\"margin-top: 3px\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 500\">Keyword<\u002Fspan><span style=\"font-size: 12px; color: var(--muted)\">Exact matches only<\u002Fspan><\u002Fspan><\u002Flabel>\n            <\u002Fdiv>\n          <\u002Ffieldset>\n          <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line)\">\n            <label for=\"topk\" style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 500\">Passages per answer<\u002Fspan><span style=\"font-size: 12px; color: var(--muted)\">More passages = broader answers, slower replies<\u002Fspan><\u002Flabel>\n            <input id=\"topk\" type=\"number\" value=\"12\" style=\"width: 88px; height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; font-family: 'Geist Mono', monospace\">\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line)\">\n            <label for=\"rerank\" style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 500\">Re-rank passages<\u002Fspan><span style=\"font-size: 12px; color: var(--muted)\">A second pass that puts the most relevant passages first<\u002Fspan><\u002Flabel>\n            <input id=\"rerank\" type=\"checkbox\" checked=\"checked\">\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line)\">\n            <label for=\"strict\" style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 500\">Answer only from sources<\u002Fspan><span style=\"font-size: 12px; color: var(--muted)\">Say “not found in your data” instead of guessing<\u002Fspan><\u002Flabel>\n            <input id=\"strict\" type=\"checkbox\" checked=\"checked\">\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px\">\n            <label for=\"calc\" style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 500\">Calculate from tables<\u002Fspan><span style=\"font-size: 12px; color: var(--muted)\">Run totals and percentages on CSV/XLSX rows instead of reading them<\u002Fspan><\u002Flabel>\n            <input id=\"calc\" type=\"checkbox\" checked=\"checked\">\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"ingestion\" style=\"border: 1px solid var(--line); border-radius: 12px\">\n          <div style=\"padding: 18px 20px; border-bottom: 1px solid var(--line)\"><h2 style=\"margin: 0; font-size: 15px; font-weight: 600\">Ingestion<\u002Fh2><\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 18px 20px; border-bottom: 1px solid var(--line)\">\n            <label style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-weight: 500\">Chunk size (tokens)<\u002Fspan><input type=\"number\" value=\"400\" style=\"height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; font-family: 'Geist Mono', monospace\"><\u002Flabel>\n            <label style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-weight: 500\">Overlap (tokens)<\u002Fspan><input type=\"number\" value=\"60\" style=\"height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; font-family: 'Geist Mono', monospace\"><\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line)\">\n            <label for=\"ocr\" style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 500\">Read scanned PDFs (OCR)<\u002Fspan><span style=\"font-size: 12px; color: var(--muted)\">Slower; needed for scanned contracts<\u002Fspan><\u002Flabel>\n            <input id=\"ocr\" type=\"checkbox\">\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px\">\n            <label for=\"reidx\" style=\"display: flex; flex-direction: column\"><span style=\"font-weight: 500\">Re-index when a source file changes<\u002Fspan><span style=\"font-size: 12px; color: var(--muted)\">Keeps answers in step with the latest version<\u002Fspan><\u002Flabel>\n            <input id=\"reidx\" type=\"checkbox\" checked=\"checked\">\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section id=\"team\" style=\"border: 1px solid var(--line); border-radius: 12px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line)\"><h2 style=\"margin: 0; font-size: 15px; font-weight: 600\">Team &amp; access<\u002Fh2><button type=\"button\" style=\"height: 34px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); font-size: 13px; cursor: pointer\">Invite<\u002Fbutton><\u002Fdiv>\n          <div style=\"overflow-x: auto\">\n            <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px\">\n              <sc-raw-tbody>\n                <sc-raw-tr><sc-raw-td style=\"padding: 12px 20px; border-bottom: 1px solid var(--line); font-weight: 500\">Ama Mensah<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px; border-bottom: 1px solid var(--line); color: var(--muted)\">Regional Sales Manager<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 20px; border-bottom: 1px solid var(--line); text-align: right\"><span style=\"display: inline-flex; height: 24px; align-items: center; padding: 0 10px; border: 1px solid var(--accent); border-radius: 999px; font-size: 12px\">Admin<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding: 12px 20px; border-bottom: 1px solid var(--line); font-weight: 500\">Kwame Asante<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px; border-bottom: 1px solid var(--line); color: var(--muted)\">Revenue Operations<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 20px; border-bottom: 1px solid var(--line); text-align: right\"><span style=\"display: inline-flex; height: 24px; align-items: center; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px\">Editor<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n                <sc-raw-tr><sc-raw-td style=\"padding: 12px 20px; font-weight: 500\">Priya Nair<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px; color: var(--muted)\">Sales Manager, East<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 20px; text-align: right\"><span style=\"display: inline-flex; height: 24px; align-items: center; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px\">Viewer<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n          <div style=\"padding: 14px 20px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted)\">Managers only see answers drawn from files and records they can already open in the source.<\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:960}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { theme: this.initTheme(props) };\n  }\n  initTheme(p) {\n    if (p && p.theme) return p.theme;\n    try { const v = window.localStorage.getItem('tally-theme'); if (v === 'dark' || v === 'light') return v; } catch (e) {}\n    return 'light';\n  }\n  componentDidUpdate(prev) {\n    if (this.props.theme && prev.theme !== this.props.theme) this.setState({ theme: this.props.theme });\n  }\n  themeVals() {\n    const d = this.state.theme === 'dark';\n    return {\n      themeClass: d ? 't-dark' : 't-light',\n      isDark: d,\n      isLight: !d,\n      themeLabel: d ? 'Switch to light theme' : 'Switch to dark theme',\n      toggleTheme: () => {\n        const t = this.state.theme === 'dark' ? 'light' : 'dark';\n        try { window.localStorage.setItem('tally-theme', t); } catch (e) {}\n        this.setState({ theme: t });\n      }\n    };\n  }\n  renderVals() { return this.themeVals(); }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
