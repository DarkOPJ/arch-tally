00%);--side:#FAF0F5;--side-active:rgba(140,29,58,.07);--surface:#FFFFFF;--surface-2:#FCF5F8;--line:#EEDFE7;--line-strong:#DCC6D2;--text:#1F1A1E;--muted:#6B5C66;--accent:#8C1D3A;--accent-fill:#8C1D3A;--on-accent:#FFFFFF;--accent-soft:#F7E4EB;--ring:linear-gradient(90deg,#A5343F 0%,#C41F62 48%,#3E1453 100%);--note:#7A4FA0;--badge:#6D3BD8;--shadow:0 1px 3px rgba(90,20,50,.08)}\n.t-dark{--bg:#212121;--side:#171717;--side-active:#2A2A2A;--surface:#2A2A2A;--surface-2:#262626;--line:#333333;--line-strong:#4A4A4A;--text:#ECECEC;--muted:#A3A3A3;--accent:#F27A98;--accent-fill:#B32A4E;--on-accent:#FFFFFF;--accent-soft:#3A262C;--ring:linear-gradient(90deg,#C4444F 0%,#E2357D 48%,#7A3BA8 100%);--note:#C9A9EA;--badge:#8B5CF6;--shadow:none}\nbody{margin:0}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"width: 1440px; height: 900px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); font-family: 'Geist', system-ui, sans-serif; font-size: 14px; line-height: 1.55\">\n  <sc-for list=\"{{themes}}\" as=\"t\" hint-placeholder-count=\"2\">\n    <section class=\"{{t.cls}}\" style=\"background: var(--bg); color: var(--text); padding: 56px; display: flex; flex-direction: column; gap: 32px\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px\">\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--accent)\">{{t.tag}}<\u002Fspan>\n        <h2 style=\"margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em\">{{t.name}}<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px\">\n        <sc-for list=\"{{swatches}}\" as=\"w\" hint-placeholder-count=\"8\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <div style=\"height: 56px; border: 1px solid var(--line); border-radius: 10px; background: {{w.css}}\"><\u002Fdiv>\n            <span style=\"font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--muted)\">{{w.name}}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 14px; padding: 24px; border: 1px solid var(--line); border-radius: 14px; background: var(--side)\">\n        <div style=\"align-self: flex-end; padding: 10px 14px; border-radius: 12px; background: var(--accent-fill); color: var(--on-accent)\">Which reps missed quota in Q3?<\u002Fdiv>\n        <span style=\"font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--accent)\">searched 4 sources · 12 passages<\u002Fspan>\n        <span>Three of seven West reps finished below quota. <span style=\"display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; border: 1px solid var(--accent); border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-family: 'Geist Mono', monospace; font-size: 11px\">1<\u002Fspan><\u002Fspan>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n          <span style=\"display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 8px; background: var(--accent-fill); color: var(--on-accent); font-weight: 500\">Primary<\u002Fspan>\n          <span style=\"display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 8px; color: var(--accent)\">Outline<\u002Fspan>\n          <span style=\"display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface)\">Secondary<\u002Fspan>\n          <span style=\"display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface)\">Chip<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 14px 16px; border: 2px solid transparent; border-radius: 14px; background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--ring) border-box; color: var(--muted)\">Ask about pipeline, quota, reps, accounts…<\u002Fdiv>\n        <span style=\"font-size: 12px; color: var(--note); text-align: center\">Answers are drawn from your indexed data and cite their sources.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      themes: [\n        { cls: 't-light', name: 'Light', tag: 'default' },\n        { cls: 't-dark', name: 'Dark', tag: 'toggle · sun / moon' }\n      ],\n      swatches: [\n        { name: 'bg', css: 'var(--bg)' },\n        { name: 'side', css: 'var(--side)' },\n        { name: 'surface', css: 'var(--surface)' },\n        { name: 'line', css: 'var(--line-strong)' },\n        { name: 'text', css: 'var(--text)' },\n        { name: 'muted', css: 'var(--muted)' },\n        { name: 'accent', css: 'var(--accent-fill)' },\n        { name: 'ring', css: 'var(--ring)' }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
